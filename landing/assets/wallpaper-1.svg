<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract wallpaper in the spirit of recent macOS: soft luminous ribbons. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d4ff"/><stop offset=".45" stop-color="#b9a6ff"/><stop offset="1" stop-color="#ffc6d9"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b2fd6"/><stop offset=".55" stop-color="#8f5cff"/><stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2ff"/><stop offset=".5" stop-color="#b48cff"/><stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-200 760 C 200 520 520 900 900 640 S 1500 360 1800 520 L 1800 1200 L -200 1200 Z" fill="url(#r1)" opacity=".9"/>
    <path d="M-200 600 C 260 380 600 700 980 470 S 1520 200 1800 300 L 1800 520 C 1500 380 1240 640 900 720 S 300 640 -200 860 Z" fill="url(#r2)" opacity=".75"/>
    <circle cx="1300" cy="180" r="220" fill="#fff4f8" opacity=".7"/>
  </g>
  <path d="M-100 640 C 300 430 620 760 980 540 S 1500 300 1750 380" fill="none" stroke="url(#r3)" stroke-width="10" filter="url(#glow)"/>
  <path d="M-100 820 C 320 600 640 960 1000 720 S 1520 470 1750 560" fill="none" stroke="url(#r3)" stroke-width="6" filter="url(#glow)" opacity=".7"/>
</svg>
