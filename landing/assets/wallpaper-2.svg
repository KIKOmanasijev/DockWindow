<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract wallpaper for Desktop 2: a calm teal and dawn variant. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f2e6"/><stop offset=".5" stop-color="#a9dcf5"/><stop offset="1" stop-color="#fff0c4"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c9c8a"/><stop offset=".55" stop-color="#3fb5e8"/><stop offset="1" stop-color="#ffcf6e"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ef0cf"/><stop offset=".5" stop-color="#7cc8ff"/><stop offset="1" stop-color="#ffe2a3"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-200 700 C 240 900 560 520 940 700 S 1520 900 1800 640 L 1800 1200 L -200 1200 Z" fill="url(#r1)" opacity=".85"/>
    <path d="M-200 520 C 300 720 620 360 1000 540 S 1540 700 1800 460 L 1800 640 C 1500 860 1200 600 900 760 S 260 840 -200 760 Z" fill="url(#r2)" opacity=".75"/>
    <circle cx="300" cy="170" r="230" fill="#fffbea" opacity=".75"/>
  </g>
  <path d="M-100 600 C 320 800 640 440 1000 620 S 1520 780 1750 560" fill="none" stroke="url(#r3)" stroke-width="10" filter="url(#glow)"/>
</svg>
